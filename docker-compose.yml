services:
  mysql:
    image: mysql:8.0
    container_name: seatrush-mysql
    environment:
      MYSQL_DATABASE: seatrush
      MYSQL_USER: seatrush
      MYSQL_PASSWORD: seatrush
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: seatrush-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
