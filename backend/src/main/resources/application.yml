server:
  port: 8080

spring:
  application:
    name: seatrush-backend

  datasource:
    url: jdbc:mysql://localhost:3306/seatrush?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: seatrush
    password: seatrush
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
